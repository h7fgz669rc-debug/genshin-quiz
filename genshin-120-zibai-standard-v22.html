 // Additional verified game asset names for persistently missing portraits.
 const missingAssetIds={"夢見月瑞希":"Mizuki","ニコ":"Nicole","藍硯":"Lanyan"};
 const missingId=missingAssetIds[c.name];
 if(missingId){
  sources.push(`https://enka.network/ui/UI_AvatarIcon_${missingId}.png`);
  sources.push(`https://gi.yatta.moe/assets/UI/UI_AvatarIcon_${missingId}.png`);
 }
 const recoveredIcon=recoveredGameIcons[c.name];
 if(recoveredIcon){
  sources.push(`https://enka.network/ui/UI_AvatarIcon_${recoveredIcon}.png`);
  sources.push(`https://gi.yatta.moe/assets/UI/UI_AvatarIcon_${recoveredIcon}.png`);
 }
 // Newer-character candidate assets use game-internal filenames; fall back to older API.
 const icon=imageIconCandidates[c.name];
 if(icon){
  sources.push(`https://static.nanoka.cc/gi/UI/UI_AvatarIcon_${icon}.webp`);
  sources.push(`https://gi.yatta.moe/assets/UI/UI_AvatarIcon_${icon}.png`);
  sources.push(`https://enka.network/ui/UI_AvatarIcon_${icon}.png`);
 }
 // Additional icon fallback for newer characters. A URL candidate is not proof the file exists.
 const wikiName=wikiIconNames[c.name];
 if(wikiName){
  sources.push(`https://genshin-impact.fandom.com/wiki/Special:FilePath/${encodeURIComponent(wikiName+' Icon.png')}`);
 }
 if(c.slug){
  const slug=encodeURIComponent(c.slug);
  sources.push(`https://genshin.jmp.blue/characters/${slug}/icon`);
  sources.push(`https://genshin.dev/api/characters/${slug}/icon`);
  sources.push(`https://genshin.jmp.blue/characters/${slug}/icon-big`);
  if(!wikiName){
   const wikiFromSlug=c.slug.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
   sources.push(`https://genshin-impact.fandom.com/wiki/Special:FilePath/${encodeURIComponent(wikiFromSlug+' Icon.png')}`);
  }
 }
 if(sources.length){
  img.dataset.sources=JSON.stringify([...new Set(sources)]);
  img.dataset.sourceIndex='0';
  img.classList.remove('failed');
  img.src=sources[0];
 }else{
  img.classList.add('failed');
 }
}
function update(){el('count').textContent=`${solved.size} / ${characters.length}`;el('remain').textContent=`残り ${characters.length-solved.size}`;}
function finish(){ended=true;el('answer').disabled=true;el('submit').disabled=true;el('giveup').disabled=true;}
el('form').addEventListener('submit',event=>{
 event.preventDefault();if(ended)return;
 const value=normalize(el('answer').value);if(!value)return;
 const i=characters.findIndex(c=>normalize(c.name)===value||(c.reading&&normalize(c.reading)===value));
 if(i<0){el('message').textContent='未登録または不正解です。';return;}
 if(solved.has(i)){el('message').textContent='そのキャラは回答済みです。';el('answer').value='';return;}
 solved.add(i);reveal(i,'done');el('message').textContent=`正解：${characters[i].name}`;el('answer').value='';update();
 if(solved.size===characters.length){finish();el('message').textContent='全問正解！';}
});
el('giveup').addEventListener('click',()=>{
 if(ended||!confirm('ギブアップして未回答の名前を表示しますか？'))return;
 characters.forEach((c,i)=>{if(!solved.has(i))reveal(i,'revealed');});
 finish();el('message').textContent='終了しました。未回答の名前を表示しています。';
});
setInterval(()=>{
 if(ended)return;const sec=Math.floor((Date.now()-started)/1000);
 el('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
},1000);
update();
</script></body></html>
